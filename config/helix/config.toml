theme = "base16_default"

[keys.insert]
k = { j = "normal_mode" }

[keys.normal]
Z = { Z = ":write-quit", Q = ":quit!" }
o = { w = ":write" }
m = { r = ":sh make run", c = ":config-reload", b = ":sh make build", f = ":format", l = ":rl" }

[editor]
cursorline = true
lsp.display-inlay-hints = true
line-number = "relative"

[editor.inline-diagnostics]
cursor-line = "hint"

[editor.soft-wrap]
wrap-indicator = ""
enable = false

